name: Build and Release lva-installer

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install system deps for archiving
        run: sudo apt-get update && sudo apt-get install -y zip unzip

      - name: Install npm dependencies
        run: npm ci

      - name: Run build.js
        run: node build.js

      - name: List produced archives
        run: ls -la bin/

      - name: Upload archives as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lva-installer-archives
          path: bin/*.tar.gz
          if-no-files-found: error

      - name: Upload zip archives as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lva-installer-zip
          path: bin/*.zip
          if-no-files-found: error

      - name: Create GitHub Release with artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/*.tar.gz
            bin/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}