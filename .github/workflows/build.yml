name: Build and Release lva-installer

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: macos-x86_64
            os: macos-13
          - name: macos-arm64
            os: macos-14
          - name: windows-x86_64
            os: windows-latest

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install system deps for archiving (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zip unzip

      - name: Install npm dependencies (native build for this platform)
        run: npm ci

      - name: Run build.js for this platform only
        run: node build.js --target=${{ matrix.name }}
        env:
          LVA_BUILD_TARGET: ${{ matrix.name }}

      - name: List produced archives
        shell: bash
        run: ls -la bin/

      - name: Upload archive as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: lva-installer-${{ matrix.name }}
          path: |
            bin/*.tar.gz
            bin/*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform archives
        uses: actions/download-artifact@v4
        with:
          path: bin
          pattern: lva-installer-*
          merge-multiple: true

      - name: List downloaded archives
        run: ls -la bin/

      - name: Upload artifacts to the published GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/*.tar.gz
            bin/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}